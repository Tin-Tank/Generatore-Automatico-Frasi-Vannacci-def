            document.getElementById('quoteOutput').textContent = `"${currentText}"`;

        function shareQuote() {
            if (navigator.share) {
                navigator.share({
                    title: 'Pensiero Motivazionale',
                    text: `"${currentText}"`
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`"${currentText}"`).then(() => {
                    showToast();
                });
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {

            }, 2500);
