<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensiero Militare del Bracco Vanny</title>

    <!-- Meta tag per anteprima Social (Open Graph & Twitter) -->
    <meta property="og:title" content="Pensiero Strategico del Bracco Vanny">
    <meta property="og:description" content="Rapporto tattico immediato, privo di fronzoli progressisti.">
    <meta property="og:image" content="generatore.jpg">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Rapporto del Bracco Vanny">
    <meta name="twitter:description" content="Ordine del giorno breve e inattaccabile.">
    <meta name="twitter:image" content="generatore.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="generatore.jpg">

    <!-- Fogli di stile esterni -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ECE9E2;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .quote-font {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 text-[#1A251B]">

    <main class="max-w-xl w-full mx-auto my-auto flex flex-col items-center">
        
        <!-- Immagine di Copertina Adattabile -->
        <div class="w-full max-w-xl mx-auto mb-6 rounded-2xl overflow-hidden shadow-md border-2 border-[#8A9A86] flex justify-center bg-[#E5DFD3]">
            <img src="generatore.jpg" alt="Copertina" class="w-full h-auto max-h-80 object-contain block">
        </div>

        <!-- Box Frase Motivazionale -->
        <div class="w-full bg-[#E5DFD3] rounded-3xl p-6 sm:p-10 shadow-lg border-2 border-[#8A9A86] text-center relative mb-8">
            <p id="quoteOutput" class="quote-font text-xl sm:text-3xl font-extrabold leading-tight text-[#243324] uppercase tracking-wider">
                "IN ATTESA DEL RAPPORTO TATTICO..."
            </p>
        </div>

        <!-- Pulsanti Azione -->
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
            <button onclick="generateQuote()" class="flex-1 bg-[#243324] hover:bg-[#1A251B] text-white font-black py-4 px-6 rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2 tracking-wide">
                <i class="fa-solid fa-rotate"></i>
                <span>CARICA ORDINE D'ASSALTO</span>
            </button>

            <button onclick="shareQuote()" class="bg-[#C8C0AC] hover:bg-[#B3A992] text-[#1A251B] font-black py-4 px-6 rounded-2xl transition-all active:scale-95 flex items-center justify-center space-x-2 tracking-wide">
                <i class="fa-solid fa-share-nodes"></i>
                <span>DIVULGA AL REPARTO</span>
            </button>
        </div>

    </main>

    <!-- Toast Notifica Copia -->
    <div id="toast" class="fixed bottom-6 bg-[#1A251B] text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none">
        DISPACCIO COPIATO NEGLI APP
