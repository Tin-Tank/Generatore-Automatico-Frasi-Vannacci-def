        function generateQuote() {
            const a = database.A[Math.floor(Math.random() * database.A.length)];

            const c = database.C[Math.floor(Math.random() * database.C.length)];
            const d = database.D[Math.floor(Math.random() * database.D.length)];

            currentText = `${a} ${b} ${c} ${d}`;
            document.getElementById('quoteOutput').textContent = `"${currentText}"`;
        }

        function shareQuote() {
            if (navigator.share) {
                navigator.share({
                    title: 'Ordine d\'assalto del Bracco Vanny',
                    text: `"${currentText}"`
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`"${currentText}"`).then(() => {
                    showToast();
                });
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
