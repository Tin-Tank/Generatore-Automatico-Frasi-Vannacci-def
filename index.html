                "cacciare dai ruoli educativi chiunque promuova il lavaggio del cervello gender.",
                "restaurare la maestà dello Stato contro il caos e la delinquenza di strada.",
                "difendere la proprietà privata come un santuario inviolabile ed assoluto.",
                "far rispettare il Codice di Marcia a chiunque pretenda di risiedere in Italia.",
                "sostituire i salotti radical chic con la concretezza dell'addestramento militare.",
                "tutelare i nostri nonni e le nostre donne dalla violenza dei predoni urbani.",
                "ripristinare il saluto alla Bandiera ogni mattina nelle scuole del Regno.",
                "esaltare la gloria della nostra storia contro la vergogna della cancel culture.",
                "infrangere i dogma del mondialismo con la forza d'urto del patriottismo.",
                "blindare le tratte ferroviarie locali con pattuglie d'assalto armate.",
                "insegnare il rispetto per gli anziani, per i maestri e per le Autorità.",
                "rigettare le quote rosa e fluide in favore della pura competenza sul campo.",
                "riconquistare ogni centimetro di territorio nazionale ceduto al degrado.",
                "forgiare una generazione di guerrieri pronti a servire la Nazione.",
                "combattere la criminalità etnica con la massima fermezza consentita dalla legge.",
                "restituire orgoglio, vigore e fierezza a tutto il Popolo Italiano.",

            ]
        };

        let currentText = "";

        function generateQuote() {
            const a = database.A[Math.floor(Math.random() * database.A.length)];
            const b = database.B[Math.floor(Math.random() * database.B.length)];
            const c = database.C[Math.floor(Math.random() * database.C.length)];
            const d = database.D[Math.floor(Math.random() * database.D.length)];

            currentText = `${a} ${b} ${c} ${d}`;
            document.getElementById('quoteOutput').textContent = `"${currentText}"`;
        }

        function shareQuote() {
            if (navigator.share) {
                navigator.share({
                    title: 'Pensiero Strategico del Generale',
                    text: `"${currentText}"`
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`"${currentText}"`).then(() => {
                    showToast();
                });
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.onload = generateQuote;
    </script>
